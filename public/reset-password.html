<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Нова лозинка — Arena Fitness Prilep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<section>
  <div class="container">
    <div class="form-card">
      <h1 class="display" style="font-size:2rem; margin-bottom:6px;">Нова лозинка</h1>
      <p style="margin-bottom:24px;">Внеси ја новата лозинка за твојата сметка.</p>
      <form id="resetForm">
        <div class="field">
          <label for="password">Нова лозинка</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="field">
          <label for="confirm">Потврди лозинка</label>
          <input type="password" id="confirm" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Постави нова лозинка</button>
        <p id="resetMsg" class="form-msg"></p>
      </form>
      <p class="form-foot"><a href="login.html">← Назад кон најава</a></p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="i18n.js"></script>
<script src="layout.js"></script>
<script>
  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('resetMsg').textContent = 'Линкот е невалиден. Побарај нов линк за промена на лозинката.';
    document.getElementById('resetMsg').className = 'form-msg err';
    document.getElementById('resetForm').querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
  }

  document.getElementById('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('resetMsg');
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      msg.textContent = 'Лозинките не се совпаѓаат.';
      msg.className = 'form-msg err';
      return;
    }
    fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: password }),
    }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          msg.textContent = 'Лозинката е сменета. Пренасочување кон најава…';
          msg.className = 'form-msg ok';
          setTimeout(function () { window.location.href = 'login.html'; }, 1500);
        } else {
          msg.textContent = res.data.error || 'Настана грешка.';
          msg.className = 'form-msg err';
        }
      });
  });
</script>
</body>
</html>
