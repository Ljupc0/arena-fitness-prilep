<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Закажи пробен термин — Arena Fitness Prilep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<section>
  <div class="container">
    <div style="text-align:center; margin-bottom:36px;">
      <span class="eyebrow" data-i18n="contact.eyebrow">Контакт</span>
      <h1 class="display" style="font-size:clamp(2.4rem,5vw,3.6rem); margin-bottom:10px;" data-i18n="contact.title">Закажи пробен термин</h1>
      <p style="max-width:52ch; margin:0 auto;" data-i18n="contact.subtitle">Пополни ја формата и ќе те контактираме за да закажеме термин за твојата прва бесплатна посета.</p>
    </div>

    <div class="form-card">
      <form id="leadForm">
        <div class="field">
          <label for="name" data-i18n="contact.formName">Име и презиме</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label for="email" data-i18n="contact.formEmail">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="phone" data-i18n="contact.formPhone">Телефон</label>
          <input type="tel" id="phone" placeholder="070 000 000" data-i18n-placeholder="contact.formPhonePlaceholder">
        </div>
        <div class="field">
          <label for="interest" data-i18n="contact.formInterest">Пакет што те интересира</label>
          <select id="interest">
            <option value="" data-i18n="contact.formInterestDefault">Не сум сигурен/а</option>
          </select>
        </div>
        <div class="field">
          <label for="message" data-i18n="contact.formMessage">Порака (опционално)</label>
          <textarea id="message" placeholder="На пр. кога ти одговара термин, дали имаш искуство со тренинг..." data-i18n-placeholder="contact.formMessagePlaceholder"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="contact.formSubmit">Испрати барање</button>
        <p id="leadMsg" class="form-msg"></p>
      </form>
    </div>

    <div class="grid-2" style="margin-top:50px; align-items:stretch;">
      <div class="feature-card">
        <div class="icon">🕒</div>
        <h3 data-i18n="contact.infoHoursTitle">Работно време</h3>
        <p id="infoHours">—</p>
      </div>
      <div class="feature-card" id="contactIconsCard">
        <h3 data-i18n="footer.contactTitle" style="margin-bottom:16px;">Контакт</h3>
        <div class="icon-row" id="contactIcons"></div>
      </div>
    </div>

    <div class="section-head" style="margin-top:56px;">
      <div>
        <span class="eyebrow" data-i18n="contact.mapTitle">Каде се наоѓаме</span>
        <h2 class="section-title" style="font-size:1.8rem;" id="mapAddress">—</h2>
      </div>
      <a id="mapOpenLink" href="#" target="_blank" rel="noopener" class="btn btn-outline" data-i18n="contact.mapOpenLink">Отвори во Google Maps</a>
    </div>
    <div class="map-embed">
      <iframe id="mapFrame" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Arena Fitness Prilep — локација"></iframe>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="i18n.js"></script>
<script src="layout.js"></script>
<script>
  function renderContactIcons() {
    document.getElementById('contactIcons').innerHTML =
      Arena.addressLink() + Arena.phoneLink() + Arena.emailLink() +
      '<div class="social-row"><span class="social-label">' + I18N.t('common.followUs') + '</span>' + Arena.instagramBadge() + '</div>';
  }

  Arena.infoReady.then(function (info) {
    document.getElementById('infoHours').innerHTML = info.hours.map(function (h) { return h.label + ': ' + h.value; }).join('<br>');
    document.getElementById('mapAddress').textContent = info.address;

    var lat = info.lat || 41.3439648;
    var lng = info.lng || 21.5517821;
    document.getElementById('mapFrame').src = 'https://www.google.com/maps?q=' + lat + ',' + lng + '&z=16&output=embed';
    document.getElementById('mapOpenLink').href = info.mapsUrl || ('https://www.google.com/maps?q=' + lat + ',' + lng);

    renderContactIcons();
    I18N.onChange(renderContactIcons);
  });

  fetch('/api/plans').then(function (r) { return r.json(); }).then(function (plans) {
    var sel = document.getElementById('interest');
    plans.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    var params = new URLSearchParams(window.location.search);
    var plan = params.get('plan');
    if (plan && Array.prototype.some.call(sel.options, function (o) { return o.value === plan; })) {
      sel.value = plan;
    }
  });

  document.getElementById('leadForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('leadMsg');
    var payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      interest: document.getElementById('interest').value,
      message: document.getElementById('message').value.trim(),
    };
    fetch('/api/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          msg.textContent = I18N.t('contact.msgSuccess');
          msg.className = 'form-msg ok';
          document.getElementById('leadForm').reset();
        } else {
          msg.textContent = res.data.error || I18N.t('contact.msgError');
          msg.className = 'form-msg err';
        }
      });
  });
</script>
</body>
</html>
